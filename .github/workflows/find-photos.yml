# Finds freely licensed photo candidates on Wikimedia Commons for the queries in
# scripts/photo-queries.json and pushes them to the photo-candidates branch for review.
name: Find photo candidates
run-name: "Find photos ${{ inputs.part }}"
on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Part name: pushes photo-candidates-PART (and reads scripts/photo-queries-PART.json when no queries are given)'
        required: false
        default: ''
      queries:
        description: 'The queries as JSON ({"key": "search||N"}); when given, nothing needs to be on main'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: find-photos-${{ inputs.part }}
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A run can trigger this a moment before its query file reaches main: wait for it (up to 3 minutes)
      # instead of failing, using the newest main each time.
      - name: Queries from the dispatch input
        if: inputs.queries != ''
        env:
          Q: ${{ inputs.queries }}
        run: |
          F=scripts/photo-queries${{ inputs.part && format('-{0}', inputs.part) || '' }}.json
          printf '%s' "$Q" > "$F" && jq -e 'type == "object" and length > 0' "$F" > /dev/null || { echo "::error::queries input is not a JSON object"; exit 1; }
      - name: Wait for the query file
        if: inputs.queries == ''
        run: |
          F=scripts/photo-queries${{ inputs.part && format('-{0}', inputs.part) || '' }}.json
          for i in $(seq 1 12); do
            [ -f "$F" ] && exit 0
            sleep 15
            git fetch -q origin main && git checkout -q origin/main -- scripts/ 2>/dev/null || true
          done
          echo "::warning::$F never arrived on main; nothing to search"
          echo "SKIP=1" >> "$GITHUB_ENV"
      - run: node scripts/find-photo-candidates.mjs && node scripts/summarize-candidates.mjs
        if: env.SKIP != '1'
        env:
          PART: ${{ inputs.part }}
      - name: Push candidates branch
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B=photo-candidates${{ inputs.part && format('-{0}', inputs.part) || '' }}
          git checkout --orphan $B
          git rm -rf --cached . > /dev/null
          git add -f photo-candidates
          git commit -m "Photo candidates"
          git push -f origin $B
