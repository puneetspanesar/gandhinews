# Downloads photos (1280px renditions) and pushes them to a photo-raw branch for the run to resize and register.
# Runs pass exactly what to fetch: -f part=<tag> -f entries='[{"id":"...","url":"..."}]'. Nothing needs to be on main.
# Without entries it falls back to the old behaviour: every content/photos.json entry not yet in public/photos.
name: Download photos
on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Run tag; results go to the photo-raw-PART branch (photo-raw when empty)'
        required: false
        default: ''
      entries:
        description: 'JSON array of {"id","url"} to download'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: download-photos-${{ inputs.part }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            content/photos.json
          sparse-checkout-cone-mode: false
      - name: List what to fetch
        env:
          E: ${{ inputs.entries }}
        run: |
          mkdir -p raw
          if [ -n "$E" ]; then
            printf '%s' "$E" | jq -er '.[] | "\(.id)\t\(.url)"' > want.tsv || { echo "::error::entries input is not a JSON array of {id,url}"; exit 1; }
            echo "EXPLICIT=1" >> "$GITHUB_ENV"
          else
            git fetch -q --depth 1 origin main && git checkout -q origin/main -- content/photos.json
            git ls-tree -r --name-only origin/main public/photos | sed 's#public/photos/##' > have.txt || true
            jq -r '.[] | select(.composite == null) | "\(.id)\t\(.sourceUrl)"' content/photos.json | sort -u | while IFS=$'\t' read -r id url; do
              grep -q "^$id-1280.jpg$" have.txt && continue
              case "$id" in cx-*|pt-*) continue;; esac
              printf '%s\t%s\n' "$id" "$url"
            done > want.tsv
          fi
          echo "$(wc -l < want.tsv) photos to fetch"
      - name: Download
        run: |
          UA='GandhiNewsPhotoFetcher/1.1 (https://github.com/puneetspanesar/gandhinews)'
          fails=0
          while IFS=$'\t' read -r id url; do
            code=$(curl -s -L --retry 4 --retry-delay 8 --retry-all-errors -A "$UA" -o "raw/$id.jpg" -w '%{http_code}' "$url")
            # A 1600px thumbnail fails when the original is smaller; fall back to the original file.
            if { [ "$code" != "200" ] || ! file -b --mime-type "raw/$id.jpg" | grep -q "^image/"; } && echo "$url" | grep -q '/thumb/'; then
              orig=$(echo "$url" | sed -E 's#/thumb/#/#; s#/[0-9]+px-[^/]+$##')
              code=$(curl -s -L --retry 4 --retry-delay 8 --retry-all-errors -A "$UA" -o "raw/$id.jpg" -w '%{http_code}' "$orig")
            fi
            if [ "$code" != "200" ] || ! file -b --mime-type "raw/$id.jpg" | grep -q "^image/"; then
              echo "FAILED $code $id" | tee -a raw/log.txt; rm -f "raw/$id.jpg"; fails=$((fails+1))
            else
              echo "200 $id" | tee -a raw/log.txt
            fi
            sleep 1
          done < want.tsv
          echo "FAILS=$fails" >> "$GITHUB_ENV"
      - name: Push the photo-raw branch
        run: |
          B=photo-raw${{ inputs.part && format('-{0}', inputs.part) || '' }}
          cd raw && git init -q && git checkout -q -b "$B" && touch log.txt && git add . && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm raw && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
      - name: Fail when a requested photo could not be fetched
        if: env.EXPLICIT == '1' && env.FAILS != '0'
        run: echo "::error::$FAILS requested photos failed (see log.txt on the branch)" && exit 1
