# Downloads each photo in content/photos.json (1280px rendition) with curl and pushes
# them to the photo-raw branch. Resizing and the photo map are done in the repo afterwards.
name: Download photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw
          jq -r '.[] | "\(.id)\t\(.sourceUrl)"' content/photos.json | sort -u | while IFS=$'\t' read -r id url; do
            [ -f "raw/$id.jpg" ] && continue
            code=$(curl -s -L --retry 3 --retry-delay 5 -A 'GandhiNewsPhotoFetcher/1.0 (https://github.com/puneetspanesar/gandhinews; puneet.panesar24@gmail.com)' -o "raw/$id.jpg" -w '%{http_code}' "$url")
            echo "$code $id" | tee -a raw/log.txt
            sleep 1
          done
          cd raw && git init -q && git checkout -q -b photo-raw && git add . && git -c user.name=bot -c user.email=bot@x commit -qm raw && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-raw
