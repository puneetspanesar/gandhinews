name: Photo diagnostics
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U1='https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Tower_and_building_of_Reserve_Bank_of_India%2C_Mumbai_02.jpg/1280px-Tower_and_building_of_Reserve_Bank_of_India%2C_Mumbai_02.jpg'
          U2='https://upload.wikimedia.org/wikipedia/commons/a/a3/Tower_and_building_of_Reserve_Bank_of_India%2C_Mumbai_02.jpg'
          U3='https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Tower_and_building_of_Reserve_Bank_of_India,_Mumbai_02.jpg&width=1280'
          for U in "$U1" "$U2" "$U3"; do
            for UA in 'GandhiNewsPhotoFetcher/1.0 (https://github.com/puneetspanesar/gandhinews; puneet.panesar24@gmail.com)' 'Mozilla/5.0'; do
              echo "$(curl -s -L -o /dev/null -w '%{http_code} %{size_download} %{time_total}' -A "$UA" "$U") | $UA | $U" >> diag.txt
            done
          done
          cat diag.txt
          mkdir -p out && mv diag.txt out/
          cd out && git init -q && git checkout -q -b photo-diag && git add . && git -c user.name=bot -c user.email=bot@x commit -qm diag && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-diag
