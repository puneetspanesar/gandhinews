# Downloads the photos listed in content/photos.json, resizes them (1600px and 800px JPEGs)
# into public/photos/, regenerates content/photos.map.json and commits the result.
# Run it from the Actions tab after editing content/photos.json.
name: Fetch photos

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Download every photo again, even ones already in public/photos/'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-photos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch and resize photos
        run: node scripts/fetch-photos.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit photos and map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos content/photos.map.json
          if git diff --cached --quiet; then
            echo "No photo changes."
          else
            git commit -m "Update photos from content/photos.json"
            git push
          fi
