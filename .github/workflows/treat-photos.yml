# House collage treatment for card photos (newsroom/scripts/treat_photo.py, owner, November 9).
# After any push that changes the photo map, treat every photo story from the last 72 hours that has no treated version.
name: Treat photos
on:
  push:
    branches: [main]
    paths: ['content/photos.map.json']
  workflow_dispatch:
    inputs:
      hours:
        description: 'Treat every story from the last N hours that has no collage yet'
        required: false
        default: '72'
      redo:
        description: 'yes = throw away every collage and make them all again'
        required: false
        default: 'no'
permissions:
  contents: write
concurrency:
  group: treat-photos
  cancel-in-progress: false
jobs:
  treat:
    if: ${{ !contains(github.event.head_commit.message, '[treat]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TREAT_BUDGET_MIN: '240'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -q "rembg[cpu]==2.0.67" cairosvg==2.7.1 pyyaml pillow numpy scipy
      - name: Clear collages (redo)
        if: ${{ inputs.redo == 'yes' }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, datetime as D
          M = json.load(open('content/photos.map.json'))
          cut = (D.datetime.now(D.timezone.utc) - D.timedelta(hours=int('${{ inputs.hours }}' or 72))).isoformat()[:16]
          n = 0
          for f in glob.glob('content/en/news/*.md'):
              sid = os.path.basename(f)[:-3]; e = M.get(sid)
              m = re.search(r'^published: (\S+)', open(f).read(600), re.M)
              if e and e.get('treated') and m and str(m.group(1)) >= cut:
                  p = 'public' + e['treated']['src']
                  if os.path.exists(p): os.remove(p)
                  e.pop('treated'); n += 1
          json.dump(M, open('content/photos.map.json', 'w'), ensure_ascii=False, indent=1)
          print(n, 'collages cleared')
          PY
      - name: Treat
        run: python3 newsroom/scripts/treat_photo.py --missing ${{ inputs.hours || '72' }}
      - name: Commit
        run: |
          git config user.name "Gandhi News desk"
          git config user.email "desk@gandhinews.com"
          git add -A public/photos content/photos.map.json
          git diff --cached --quiet && { echo "nothing to treat"; exit 0; }
          git commit -q -m "Treat photos [treat]"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            # a conflict in the photo map: take main's map and treat again on top of it
            git rebase --abort 2>/dev/null; git reset -q --hard origin/main; git pull -q origin main
            TREAT_BUDGET_MIN=20 python3 newsroom/scripts/treat_photo.py --missing ${{ inputs.hours || '72' }}
            git add public/photos content/photos.map.json; git commit -q -m "Treat photos [treat]" || exit 0
            sleep $((i * 10))
          done
          exit 1
