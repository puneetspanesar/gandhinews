# Finds reusable portraits (Wikimedia Commons, CC BY YouTube frames) for people in
# scripts/portrait-people.json and pushes crops to the portrait-candidates branch for review.
name: Portrait hunt
on: workflow_dispatch
permissions:
  contents: write
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q yt-dlp opencv-python-headless numpy
      - run: python scripts/portrait-hunt.py
      - name: Push candidates
        run: |
          cd portrait-candidates && git init -q && git checkout -q -b portrait-candidates && git add . && git -c user.name=bot -c user.email=bot@x commit -qm candidates && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" portrait-candidates
